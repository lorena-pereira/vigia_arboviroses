name: CI

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ci_root_password
                    MYSQL_DATABASE: vigia_test
                    MYSQL_USER: vigia_app
                    MYSQL_PASSWORD: ci_app_password
                ports:
                    - 3307:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10
                    --health-start-period=30s

        env:
            NODE_ENV: test
            DB_HOST: 127.0.0.1
            DB_PORT: 3307
            DB_NAME: vigia_test
            DB_USER: vigia_app
            DB_PASSWORD: ci_app_password
            SESSION_SECRET: ci-only-session-secret

        steps:
            - name: Baixar codigo
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      backend/package-lock.json

            - name: Instalar dependencias da raiz
              run: npm ci

            - name: Instalar dependencias do backend
              run: npm ci
              working-directory: backend

            - name: Verificar ESLint
              run: npm run lint

            - name: Verificar Prettier
              run: npm run format:check

            - name: Preparar banco e usuarios de teste
              run: node test/setup-db.js
              working-directory: backend

            - name: Executar testes automatizados
              run: npm test
              working-directory: backend
