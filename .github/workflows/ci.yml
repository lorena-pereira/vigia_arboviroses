name: CI

on:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Baixar codigo
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      backend/package-lock.json

            - name: Instalar dependencias da raiz
              run: npm ci

            - name: Instalar dependencias do backend
              run: npm ci
              working-directory: backend

            - name: Verificar ESLint
              run: npm run lint

            - name: Verificar Prettier
              run: npm run format:check

            - name: Executar testes com MySQL isolado
              run: docker compose -f docker-compose.test.yml run --rm --build test

            - name: Encerrar ambiente de testes
              if: always()
              run: docker compose -f docker-compose.test.yml down
